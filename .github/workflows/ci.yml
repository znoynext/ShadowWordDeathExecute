name: Development CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_version:
        description: "Optional local-only SemVer tag to test Packager substitution."
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install Lua tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.1 luarocks python3-yaml
          luarocks --lua-version=5.1 --local install luacheck 1.2.0
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          cargo install stylua --version 2.5.2 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check Lua syntax
        run: |
          find ShadowWordDeathExecute -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p scripts/model_checks.lua

      - name: Run execute-indicator model checks
        run: lua5.1 scripts/model_checks.lua

      - name: Run Luacheck
        run: luacheck ShadowWordDeathExecute

      - name: Check StyLua formatting
        run: stylua --check ShadowWordDeathExecute scripts/model_checks.lua

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Validate workflow YAML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import yaml

          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              yaml.safe_load(workflow.read_text(encoding="utf-8"))
              print(f"YAML valid: {workflow}")
          PY

      - name: Validate addon invariants and TOC
        run: python3 scripts/validate_addon.py --release-workflow --secret-patterns

  package:
    name: Package RC ZIP
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Stage changelog in addon directory
        run: cp CHANGELOG.md ShadowWordDeathExecute/CHANGELOG.md

      - name: Simulate a release tag for a manual package check
        if: ${{ inputs.simulate_version != '' }}
        shell: bash
        env:
          SIMULATE_VERSION: ${{ inputs.simulate_version }}
        run: |
          if [[ ! "$SIMULATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "simulate_version must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          git -c user.name="CI package simulation" -c user.email="ci@users.noreply.github.com" tag -a "$SIMULATE_VERSION" -m "Temporary CI package simulation"

      - name: Build dry-run package
        # BigWigsMods/packager@v2.5.1
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        with:
          args: -d
          pandoc: false

      - name: Validate installable ZIP
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.simulate_version }}
        run: |
          archive="$(find .release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          if [[ -n "$EXPECTED_VERSION" ]]; then
            python3 scripts/validate_addon.py --package "$archive" --expected-version "$EXPECTED_VERSION"
          else
            python3 scripts/validate_addon.py --package "$archive"
          fi
          sha256sum "$archive" > .release/verified-package.sha256

      - name: Repackage verified staging without uploads
        # BigWigsMods/packager@v2.5.1
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        with:
          # -c skips source copying and -o preserves the validated staging directory.
          args: -c -o -d
          pandoc: false

      - name: Confirm the RC ZIP matches verified staging
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.simulate_version }}
        run: |
          sha256sum --check .release/verified-package.sha256
          archive="$(find .release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          if [[ -n "$EXPECTED_VERSION" ]]; then
            python3 scripts/validate_addon.py --package "$archive" --expected-version "$EXPECTED_VERSION"
          else
            python3 scripts/validate_addon.py --package "$archive"
          fi
          mkdir -p dist
          cp "$archive" dist/
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$(basename "$archive")" > "dist/$(basename "$archive").sha256"

      - name: Set RC artifact name
        id: rc
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload RC ZIP
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ShadowWordDeathExecute-RC-${{ steps.rc.outputs.short_sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
