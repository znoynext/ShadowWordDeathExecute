name: Update WoW Interface compatibility

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-interface:
    name: Open Interface update PR
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Update Retail and PTR Interface values
        # p3lim/toc-interface-updater@v4
        uses: p3lim/toc-interface-updater@118fd5125c8604306fc8652bfcb5dd80e8899f63
        with:
          flavor: retail
          ptr: true

      - name: Create Interface update pull request
        # peter-evans/create-pull-request@v7
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/interface-version
          delete-branch: true
          commit-message: Update WoW Interface compatibility
          title: Update WoW Interface compatibility
          body: |
            Updates the Retail and PTR values in the addon TOC using the scheduled compatibility source.
            Review the generated diff and the normal PR CI before merging.
          add-paths: ShadowWordDeathExecute/ShadowWordDeathExecute.toc
