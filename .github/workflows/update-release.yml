name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Build addon archive
        id: build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          ARCHIVE="ShadowWordDeathExecute-${VERSION}.zip"
          mkdir -p dist
          zip -r "dist/${ARCHIVE}" ShadowWordDeathExecute
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" "dist/${ARCHIVE}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/${ARCHIVE}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
