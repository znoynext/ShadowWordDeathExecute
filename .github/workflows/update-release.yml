name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize retries for a tag. This complements the existing-release preflight
# and never cancels an in-progress immutable publication.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish immutable addon release
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release tag, marketplace configuration, and immutable destination
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ vars.WAGO_PROJECT_ID }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "Refusing release: $TAG must be an annotated tag."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$TAG")"
          test -n "$TAG_COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "Refusing release: $TAG_COMMIT is not in origin/main history."
            exit 1
          fi

          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Refusing release: GitHub Release $TAG already exists."
            exit 1
          fi

          if [[ -z "$CF_PROJECT_ID" || -z "$CF_API_KEY" ]]; then
            echo "CurseForge: required configuration missing"
            exit 1
          fi

          if [[ -z "$WAGO_PROJECT_ID" || -z "$WAGO_API_TOKEN" ]]; then
            echo "Wago: required configuration missing"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install release validation runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.1 luarocks
          luarocks --lua-version=5.1 --local install luacheck 1.2.0
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          cargo install stylua --version 2.5.2 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate release source
        shell: bash
        run: |
          find ShadowWordDeathExecute -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p scripts/model_checks.lua
          lua5.1 scripts/model_checks.lua
          luacheck ShadowWordDeathExecute
          stylua --check ShadowWordDeathExecute scripts/model_checks.lua
          git diff --check "$GITHUB_SHA^!"
          python3 scripts/validate_addon.py --release-workflow --secret-patterns

      - name: Stage changelog in addon directory
        run: cp CHANGELOG.md ShadowWordDeathExecute/CHANGELOG.md

      - name: Build release ZIP without uploading
        # BigWigsMods/packager@v2.5.1
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        with:
          args: -d -p ${{ vars.CF_PROJECT_ID }} -a ${{ vars.WAGO_PROJECT_ID }}
          pandoc: false

      - name: Validate packaged release ZIP
        id: package
        shell: bash
        env:
          TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          ARCHIVE=".release/ShadowWordDeathExecute-${TAG}.zip"
          test -f "$ARCHIVE"
          python3 scripts/validate_addon.py --package "$ARCHIVE" --expected-version "$TAG"
          sha256sum "$ARCHIVE" > .release/verified-package.sha256
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish the validated staging package to addon marketplaces
        # BigWigsMods/packager@v2.5.1
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        env:
          # Packager expects CF_API_KEY; the repository secret remains CF_API_TOKEN.
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        with:
          # -c skips copying and -o keeps the package directory validated above.
          args: -c -o -p ${{ vars.CF_PROJECT_ID }} -a ${{ vars.WAGO_PROJECT_ID }}
          pandoc: false

      - name: Confirm published ZIP still matches the validated package
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          sha256sum --check .release/verified-package.sha256
          python3 scripts/validate_addon.py --package "$ARCHIVE" --expected-version "$TAG"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preflight.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" --verify-tag --title "$TAG" --generate-notes
